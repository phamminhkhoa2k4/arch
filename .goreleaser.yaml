version: 2

project_name: archaeologist

builds:
  - id: archaeologist
    main: ./cmd/archaeologist
    binary: archaeologist
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X archaeologist/internal/cli.Version={{.Version}}

archives:
  - id: default
    name_template: "archaeologist_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
