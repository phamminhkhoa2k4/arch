# Lab nginx — 2 routes on port 8080 (avoids clashing with the default site on :80).
# Route /var/ intentionally uses a variable — the nginx_variable trap in ground-truth.yaml.
server {
    listen 8080;
    server_name _;

    location /web/ {
        proxy_pass http://127.0.0.1:8081/;
    }

    location /var/ {
        set $lab_backend 127.0.0.1:8082;
        proxy_pass http://$lab_backend/;
    }
}
