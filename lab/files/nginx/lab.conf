# Lab nginx — 5 routes on port 8080 (avoids clashing with the default site on :80).
# Route /var/ intentionally uses a variable — the nginx_variable trap in ground-truth.yaml.
# Route /dead/ points at a port nobody listens on — BROKEN_ROUTE ground-truth case.
# Route /ext/ points at an external domain — known truth, no edge, no blind spot.
upstream lab_pool {
    server 127.0.0.1:8081;
    server 127.0.0.1:8082;
}

server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/lab_access.log;

    location /web/ {
        proxy_pass http://127.0.0.1:8081/;
    }

    location /var/ {
        set $lab_backend 127.0.0.1:8082;
        proxy_pass http://$lab_backend/;
    }

    location /dead/ {
        proxy_pass http://127.0.0.1:9999/;
    }

    location /pool/ {
        proxy_pass http://lab_pool/;
    }

    location /ext/ {
        proxy_pass https://example.com/;
    }
}
