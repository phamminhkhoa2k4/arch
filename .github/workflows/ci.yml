name: CI

# Build, test and lint gates plus the correlation benchmark job.
# A threshold miss prints a warning annotation and does not fail the run.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-lint:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  benchmark:
    name: Correlation benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Correlation misses and the published-but-ungated metrics
      # (recall, raw_ref, scan duration, observe overhead) print
      # ::warning annotations or informational lines and exit 0;
      # a Checkpoint #2 miss (false-orphan > 0 or LIKELY_ORPHANED
      # precision below 95%) exits 1 and fails the job, blocking the
      # merge. Tool errors also fail the job. The run appends one
      # JSON line (timestamp + git sha + all metrics) to the history
      # file, uploaded as an artifact for cross-run comparison.
      - name: Benchmark
        run: go run ./cmd/bench --db lab/fixtures/scan.db --gt lab/ground-truth.yaml --rules lab/rules.lab.yaml --out bench-results/history.jsonl
      - name: Upload benchmark history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-history
          path: bench-results/history.jsonl
          if-no-files-found: ignore
