name: Release

# GoReleaser publishes a GitHub Release on every v* tag: linux
# amd64 + arm64 binaries, tar.gz archives, and checksums.txt.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      # Full history is required for an accurate changelog.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The golden-fixture benchmark feeds the release-notes footer.
      - name: Benchmark release notes
        run: |
          go run ./cmd/bench --db lab/fixtures/scan.db --gt lab/ground-truth.yaml --rules lab/rules.lab.yaml --out bench-results/history.jsonl --notes bench-results/release-notes.md
          {
            echo 'BENCH_NOTES<<EOF_NOTES'
            cat bench-results/release-notes.md
            echo 'EOF_NOTES'
          } >> "$GITHUB_ENV"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
