# Archaeologist default rules. Embedded in the binary; override with
# delete-check --rules-file <path>. Editing this file changes verdicts
# on the next run without rescanning (verdicts recompute from stored
# evidence and are keyed by the hash of these bytes).
thresholds:
  observation_window_days: 14
  no_deploy_days: 90
  no_activity_days: 30
verdicts:
  likely_orphaned_requires:
    coverage: [HIGH, MEDIUM]
    blockers: none
  orphaned_requires:
    coverage: [HIGH]
    blockers: none
    window_sufficient: true
  fallback: UNKNOWN
coverage:
  high_ratio: 0.90
  medium_ratio: 0.60
  channels:
    listener: [procfs_net, listener_mapping]
    process: [procfs]
    systemd_unit: [systemd, journald, listener_mapping]
    container: [docker, docker_created, docker_log, listener_mapping]
    compose_service: [docker]
    cron_job: [cron]
    timer: [cron]
    script: [mtime, cron]
    nginx_route: [nginx, nginx_access_log]
    nginx_upstream: [nginx]
    image: [docker]
    volume: [docker]
    network: [docker]
